name: GitHub Pages

on:
  push:
    branches: [main]
    paths: [website/**, scripts/build-website.py, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build website from the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-website.py --repository "$GITHUB_REPOSITORY" --output build/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
